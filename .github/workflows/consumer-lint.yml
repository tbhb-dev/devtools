---
name: consumer-lint

on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9

      - name: Check vendored tooling
        run: mise run devtools:check-vendored

      - name: Install project tools
        run: mise run install-tools

      - name: Install Markdown guard
        run: mise run install-guard-markdown

      - name: Add Go binaries to PATH
        run: |
          go_path=$(go env GOPATH)
          echo "$go_path/bin" >> "$GITHUB_PATH"

      - name: Run lint gates
        run: mise run lint
