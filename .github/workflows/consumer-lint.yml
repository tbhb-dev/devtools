---
name: consumer-lint

on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.21

      - name: Check vendored tooling
        run: mise run devtools:check-vendored

      - name: Install project tools
        run: mise run install-tools

      - name: Install Markdown guard
        run: mise run install-guard-markdown

      - name: Add Go binaries to PATH
        run: |
          go_path=$(go env GOPATH)
          echo "$go_path/bin" >> "$GITHUB_PATH"

      - name: Run lint gates
        run: mise run lint
