---
# Secret scanning and supply-chain security checks.
# Two jobs run the project's dependency scanners with SARIF output and
# upload reachable govulncheck findings and the complete gomodscan
# results under separate categories. The raw govulncheck report stays
# available as an artifact. gomodscan checks the module set (retraction,
# deprecation, and OSV malicious-package checks).
#
# Triggers cover pull requests and pushes to `main` — the pushes seed
# the Code Scanning baseline that pull-request diffs compare against —
# plus a daily cron that catches advisories published against
# already-merged dependencies long after the pull request that added
# them. Findings surface in the Security tab through SARIF rather than
# failing the run, so a warning-level deprecation does not gate a pull
# request. The blocking govulncheck gate stays in `ci.yml`.
#
# The dependency jobs install pinned go and invoke the matching SARIF
# tasks. The secret scan reads full git history and fails on findings.
# Each job uses the pinned mise action and the shared local scan tasks.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# Refuse a pin the committed lockfiles have not seen; see ci.yml.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    uses: ./.github/workflows/scan-govulncheck.yml
    permissions:
      contents: read
      security-events: write

  gomodscan:
    uses: ./.github/workflows/scan-gomodscan.yml
    permissions:
      contents: read
      security-events: write

  gitleaks:
    uses: ./.github/workflows/scan-gitleaks.yml
