---
name: shell-allowlist

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-allowlist:
    name: shell-allowlist
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.21
          install_args: go

      - name: Check changed shell scripts
        env:
          MISE_LOCKED: "1"
          MISE_TASK_RUN_AUTO_INSTALL: "0"
          SHELL_ALLOWLIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/shell-allowlist --changed "$SHELL_ALLOWLIST_BASE"
