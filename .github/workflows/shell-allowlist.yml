---
name: shell-allowlist

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-allowlist:
    name: shell-allowlist
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.21
          install_args: go

      - name: Check changed shell scripts
        env:
          MISE_LOCKED: "1"
          MISE_TASK_RUN_AUTO_INSTALL: "0"
          SHELL_ALLOWLIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/shell-allowlist --changed "$SHELL_ALLOWLIST_BASE"
