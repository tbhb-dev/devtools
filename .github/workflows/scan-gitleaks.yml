---
name: scan-gitleaks

on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: gitleaks

      - name: Run gitleaks
        run: mise run devtools:gitleaks
