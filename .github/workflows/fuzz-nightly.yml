---
# Nightly fuzzing sweep. Walks every native Go fuzz target in the module
# and runs each one for a longer budget than the inner-loop `fuzz-go`
# default, so corpus growth and crasher discovery happen off the critical
# path rather than on every PR. The workflow invokes the same `fuzz-go`
# task contributors run locally, overriding only FUZZ_TIME, so the task
# stays the single source of truth for what gets fuzzed. Mirrors the
# gremlins / mutate-go-all split where one task powers both the inner loop
# and the scheduled sweep.
#
# A crash writes its reproducing input under the package's
# `testdata/fuzz/<target>/`; the workflow uploads that tree on failure so
# the crasher survives the runner teardown and can be replayed locally.

name: fuzz-nightly

on:
  schedule:
    # 02:52 UTC nightly. Off-peak and off the top of the hour, where
    # GitHub's scheduler is most congested.
    - cron: "52 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Per-target fuzz budget (Go -fuzztime duration, e.g. 5m, 30s)"
        type: string
        default: "5m"

permissions:
  contents: read

# Refuse a pin the committed lockfiles have not seen; see ci.yml.
env:
  MISE_LOCKED: "1"

concurrency:
  # Serialize scheduled and manual runs so an on-demand dispatch never races
  # a nightly run over the same corpus. Never cancel a run in flight: a
  # half-finished sweep is wasted compute.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    # One target at the 5m default fits comfortably; the sweep is sequential,
    # so revisit this ceiling as the target set grows.
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.21
          install_args: go

      - name: Run fuzz sweep
        env:
          # Scheduled runs carry no inputs, so fall back to the dispatch default.
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '5m' }}
        run: mise run fuzz-go

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
