---
name: scan-gomodscan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

env:
  MISE_LOCKED: "1"

jobs:
  gomodscan:
    name: gomodscan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Run gomodscan (SARIF)
        run: mise run devtools:gomodscan-sarif gomodscan.sarif

      - name: Upload gomodscan SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gomodscan.sarif
          category: gomodscan
