---
name: apm-package

# Validates the shared APM package for tbhb repositories whenever the
# package surface changes, with two gates.
#
#   validate: runs the pinned apm CLI through primitive validation, a
#   frozen install against apm.lock.yaml, the lockfile/on-disk audit,
#   and a working-tree check proving the committed deployed mirrors
#   under .claude/ and .agents/ match the sources under
#   packages/agents/*/.apm/. The CLI is a mise pin like every other
#   tool here, so mise.lock carries its checksum and
#   devtools:check-toolchain covers it.
#
#   scan-skills: runs Cisco's skill-scanner over packages/agents via
#   the upstream reusable workflow, uploading SARIF to code scanning
#   so a risky skill change surfaces as a PR annotation. scan-all mode
#   recurses, so one parent path covers every package's skills today
#   and picks up codex/agy without an edit once they gain any.

on:
  push:
    branches: [main]
  # No paths filter: the ruleset requires validate and scan-skills on every
  # pull request, and a workflow that never starts leaves them pending
  # forever. The changes job below decides whether validation steps run.
  pull_request:

permissions:
  contents: read

# A push gets its own group so an irrelevant push cannot replace a pending
# relevant one; only pull requests share a group per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one list of paths that make this workflow relevant. A bump of the
  # apm pin or its checksums (mise.toml, mise.lock) changes what every step
  # below runs, so those count too.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          paths=(
            apm.yml
            apm.lock.yaml
            packages/agents
            hooks
            .claude/rules
            .claude/skills
            .claude/hooks
            .claude/settings.json
            .claude/apm-hooks.json
            .agents
            .github/workflows/apm-package.yml
            .github/skill-scanner-policy.yaml
            mise.toml
            mise.lock
          )
          # Compare the endpoints the old path filters used: the topic
          # branch against its merge base for a pull request, the old and
          # new tips for a push. A diff that cannot run (a new branch's
          # all-zero before, a force-pushed-away tip, unrelated history)
          # has nothing to compare, so run the gate.
          if [ "$EVENT" = pull_request ]; then
            range=("$BASE_SHA...$HEAD_SHA")
          else
            range=("$BEFORE_SHA" "$AFTER_SHA")
          fi
          relevant=true
          if changed=$(git diff --name-only "${range[@]}" -- "${paths[@]}" 2>/dev/null); then
            [ -n "$changed" ] || relevant=false
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = false ]; then
            echo "No APM package paths changed; validation steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: validate
    needs: changes
    # Always report a result, even if detection fails. Skip the steps only
    # when the detector succeeded and reported nothing relevant.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_args narrows the install to apm alone. This job runs the
      # CLI and nothing else, so provisioning the whole toolchain would
      # trade the old curl step's speed for tools no step invokes. The
      # action appends --locked on its own once it sees mise.lock, and
      # its shims reach PATH, so the steps below call apm directly.
      - name: Set up mise
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          install_args: apm

      # The frozen install comes first because the root manifest carries
      # no primitives of its own anymore: validation reads the staged
      # dependencies under apm_modules/, so without an install it finds
      # no APM content and fails. Validate mode writes nothing, which is
      # what keeps the drift check below meaningful.
      - name: Run frozen install
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        run: apm install --frozen

      - name: Validate primitives
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        run: apm compile --validate

      - name: Audit deployed state
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        run: apm audit --ci

      - name: Check deployed copies for drift
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::apm install changed the tree; run 'mise run apm-sync' locally and commit the result"
            exit 1
          fi

  # Always runs. The ruleset requires the nested "scan-skills / Skill
  # Scanner" context, and a skipped caller reports only its own name, which
  # leaves that context pending. The upstream workflow takes no condition
  # of its own, so the scan runs on every pull request.
  scan-skills:
    name: scan-skills
    permissions:
      contents: read
      actions: read
      security-events: write
    # yamllint disable-line rule:line-length
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@ef5cfee8d15fe207e09d808ccb5be4b9ae6d321a # 2.2.2
    with:
      # scan-skills' default scan_mode is scan-all, which always adds
      # --recursive --check-overlap, and its own docs say skill_path
      # takes "a single skill directory, or a parent directory for
      # scan-all". Pointing it at the packages/agents parent finds
      # every package's skills in one pass (today only
      # packages/agents/claude/.apm/skills) and needs no edit when
      # codex/agy gain skills of their own.
      skill_path: packages/agents
      format: sarif
      fail_on_severity: high
      policy: .github/skill-scanner-policy.yaml
