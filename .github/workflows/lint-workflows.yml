---
# Lint every workflow under `.github/workflows/` via actionlint, run from
# its SHA-pinned Docker image (which bundles shellcheck). The job fires on
# every PR that touches a workflow file and on every push to `main`, so the
# lint gate guards both ends of the integration path.
#
# This workflow also exposes a `workflow_call` trigger so other tbhb
# repositories can lint their workflows through it instead of each
# carrying its own actionlint setup. A reusable workflow has to be
# self-contained: in a called workflow a `uses: ./...` local action and
# any task or recipe reference resolve against the *caller's* checkout,
# not this repo, so the job can't lean on the `devtools:lint-workflows`
# task the local entrypoint runs.
# It invokes the pinned Docker image directly against whatever tree
# `actions/checkout` lays down — this repo's on push/PR, the caller's on
# `workflow_call`.
#
# The local entrypoint runs the same actionlint version from its mise
# pin. The two pins move under different Renovate datasources (docker
# here, the mise manager there), so they can skew for the life of one
# bump PR, but both track the same upstream release.

name: lint-workflows

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          # renovate: datasource=docker depName=rhysd/actionlint
          ACTIONLINT_IMAGE="docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            "${ACTIONLINT_IMAGE}"
