---
name: scan-govulncheck

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

env:
  MISE_LOCKED: "1"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Run govulncheck (SARIF)
        run: mise run devtools:vuln-sarif govulncheck.sarif

      - name: Retain raw govulncheck SARIF
        if: ${{ !cancelled() && hashFiles('govulncheck.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-raw-sarif
          path: govulncheck.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Keep reachable findings for code scanning
        run: bash .devtools/scripts/filter-govulncheck-sarif.sh govulncheck.sarif govulncheck-reachable.sarif

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: govulncheck-reachable.sarif
          category: govulncheck
