---
# Self-hosted Renovate. Authenticates as the tbhb-dev-renovate[bot]
# GitHub App so commits carry a DCO sign-off matching the committer (the
# stock Mend hosted App commits as renovate[bot], which can't match this
# repo's gitAuthor + gitSignOff pair).
#
# This workflow also exposes a `workflow_call` trigger so other tbhb
# repositories can run self-hosted Renovate through it instead of each
# carrying this setup. A caller passes the App credentials as the
# `RENOVATE_CLIENT_ID` and `RENOVATE_PRIVATE_KEY` secrets (or
# `secrets: inherit`); checkout and the renovate action run against the
# caller's tree, so the job needs no local action or task to stay
# self-contained.
#
# Execution depends on the tbhb-dev-renovate App credentials reaching the run:
# every repository that uses this workflow carries RENOVATE_CLIENT_ID and
# RENOVATE_PRIVATE_KEY as its own Actions secrets.
name: Renovate

on:
  schedule:
    # Hourly on weekdays, every two hours on weekends. Matches Cilium's
    # cadence: fast enough to catch CVEs the same business day, slack
    # enough to avoid wasting API budget on quiet weekends.
    - cron: "11 * * * 1-5"
    - cron: "11 */2 * * 6,0"
  workflow_dispatch:
    inputs:
      renovate_log_level_debug:
        type: boolean
        description: "Run Renovate with debug log levels"
        default: true
  workflow_call:
    inputs:
      renovate_log_level_debug:
        type: boolean
        description: "Run Renovate with debug log levels"
        default: true
    secrets:
      RENOVATE_CLIENT_ID:
        required: true
      RENOVATE_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  renovate:
    name: Run self-hosted Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN can't satisfy this repo's Renovate scope (Issues +
      # Pull requests + Workflows R/W) and can't push workflow files. Mint
      # a short-lived installation token from the tbhb-dev-renovate App
      # credentials instead. Output is `token` (the older Cilium fork
      # cilium/actions-app-token exposed `app_token`).
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      # Renovate re-clones the repo inside its own container, but the
      # action needs the config file on the runner filesystem to bind
      # into the container.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_COM_TOKEN authenticates Renovate's reads of github.com:
      # preset lookups against the public tbhb-dev/devtools repo
      # and changelog fetches. Without it those reads are anonymous and
      # share the 60/hr per-IP limit, which intermittently fails preset
      # resolution with config-presets-invalid. The minted installation
      # token is a valid github.com credential, so Renovate turns it into
      # a github.com host rule and the reads get the 5000/hr authenticated
      # limit. The action forwards GITHUB_COM_TOKEN by default (it is in
      # its env-regex allowlist alongside LOG_LEVEL).
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        env:
          LOG_LEVEL: ${{ (github.event_name == 'schedule' || inputs.renovate_log_level_debug) && 'DEBUG' || 'INFO' }}
          GITHUB_COM_TOKEN: ${{ steps.get_token.outputs.token }}
          # Permit the implicit `mise lock` the mise manager runs after
          # moving a pin, so a toolchain PR carries the refreshed
          # mise.lock instead of arriving red against a MISE_LOCKED CI
          # gate. `allowedUnsafeExecutions` is globalOnly, so it cannot
          # come from the shared preset; this env entry reaches Renovate
          # through the action's RENOVATE_\w+ forwarding and covers every
          # caller at once. That grant extends to callers with no mise at
          # all, which is inert: the manager only runs `mise lock` where
          # a mise.lock file already exists.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
        with:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.57.3
          configurationFile: .github/renovate.json5
          token: ${{ steps.get_token.outputs.token }}
