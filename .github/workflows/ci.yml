---
# Main quality gate. Runs the full lint set, the test suite
# (matrixed across linux/macOS/windows native runners with the race
# detector enabled in every slot), govulncheck, and the vendor-drift
# check on every pull request and every push to `main`. Each gate
# runs as its own job so a flake in one block does not require
# rerunning the others and the PR status surfaces which gate fired.
# Each matrix slot also uploads its own coverage report to GitHub's
# code coverage API, and a downstream `coverage` job merges the slots
# into one combined report.
#
# The toolchain comes from a SHA-pinned jdx/mise-action reading
# mise.toml, the conf.d drop-ins, and the committed lockfiles, so every
# job runs the pinned binaries. Each job then invokes the matching mise
# task so the task stays the single source of truth for
# what the gate runs. The local `check` and `check-all` aggregators stay
# in lockstep with this workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen: moving a pin in
# mise.toml while leaving mise.lock alone would make mise fetch the new
# version and rewrite the lockfile in place, so a Renovate PR could pass
# while the committed digests drifted from the pins under review.
# MISE_LOCKED makes that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator task, so the job stays unchanged
  # as new gates come in — each gate appends itself to the aggregator
  # instead. The full toolchain installs from the lockfiles, go
  # included: the mise pin matches go.mod's toolchain directive, and
  # GOTOOLCHAIN=auto fetches the directive's version if the two ever
  # skew.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history, because check-versions asks `git describe` for the
      # latest release tag and the default shallow fetch reaches neither
      # the tags nor the history a describe walks. fetch-tags alone is
      # not enough for the same reason.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0

      # mise installs the vale binary but does not fetch the style
      # packages .vale.ini declares, and the Python linters run from the
      # uv.lock closure.
      - name: Sync Vale styles and Python dependencies
        run: mise run install-tools

      - name: Run lint gates
        run: mise run lint

  # The Python suite covers the package under packages/, which is pure
  # standard library and carries no platform-specific behavior, so this runs
  # on one slot rather than the os matrix the Go tests need. The coverage
  # floor is absolute (fail_under = 100 with branch coverage, set in
  # pyproject.toml), so `cover-py` is both the test run and the gate --
  # there is no per-slot data to combine downstream.
  test-py:
    name: test (python)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pinned uv, which then provisions the interpreter
      # named in .python-version and restores the locked dependency
      # closure from uv.lock.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0
          install_args: uv

      - name: Check that uv.lock matches pyproject.toml
        run: mise run lock-check

      - name: Run tests with branch coverage
        run: mise run cover-py

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Each slot publishes its own coverage report to GitHub's code
    # coverage API, which needs code-quality: write on top of the read
    # scopes (contents for checkout, pull-requests so the upload action
    # can resolve the PR number on push events). Job-level permissions
    # replace the workflow default, so the reads are listed explicitly.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise supplies go on every slot, Windows included: a probe on
      # windows-2025 showed it running a bash-shebang task body under
      # Git Bash and resolving its own go pin there, which is what
      # retired both the Justfile recipes and the actions/setup-go step
      # that used to feed them. The pin is locked for windows-x64, so
      # this installs the same toolchain MISE_LOCKED enforces everywhere
      # else.
      #
      # The first `mise run` in a job otherwise installs the whole
      # configured toolchain rather than the task's own tools, which cost
      # the probe over three minutes against roughly one of real work.
      # Turning the auto-install off leaves install_args as the single
      # place naming what this job needs.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0
          install_args: go

      - name: Run tests with coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go-binary

      - name: Run tests with race detector
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-go-race

      # Publish this slot's report under a per-OS label so each platform
      # shows on its own, and stash the binary coverage data for the
      # coverage job to merge into the combined report.
      - name: Upload ${{ matrix.os }} coverage report
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/${{ matrix.os }}
          fail-on-error: false

      - name: Upload ${{ matrix.os }} coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covdata-${{ matrix.os }}
          path: coverage.covdata
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: test
    # Publishes the merged report to the code coverage API (same scopes
    # as the per-slot uploads in the test job).
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0
          install_args: go

      - name: Download per-slot coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage.covdata.slots
          pattern: covdata-*

      - name: Merge coverage and render the combined report
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go-merge

      - name: Upload combined coverage report
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/combined
          fail-on-error: false

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0
          install_args: go

      - name: Run govulncheck
        run: mise run vuln

  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.0
          install_args: go

      - name: Check vendor drift
        run: mise run vendor-check
