---
# PR gate that catches broken Renovate config before it lands on main.
# The cron Renovate workflow only runs on schedule, so a malformed config
# on main can sit unnoticed until the next firing. Running the validator
# from the same SHA-pinned image the actual Renovate workflow uses keeps
# the two in lockstep.
#
# This workflow also exposes a `workflow_call` trigger so other tbhb
# repositories can validate their Renovate config through it instead of
# each carrying this setup. The job runs the pinned image directly against
# the tree `actions/checkout` lays down — no local action or task
# to drag in. The `config_path` input points it at the file to validate and
# defaults to `.github/renovate.json5`; a repo that keeps its config at the
# root passes `config_path: renovate.json5`.
#
# Two checks run, because the validator alone is not enough. It reports a
# config as valid without ever resolving the presets named in `extends`, so
# a second step verifies each `github>owner/repo//path` reference actually
# exists, at the `#ref` it names where it names one. Without it a broken
# reference lands green and only surfaces later, when Renovate fails at
# runtime and quietly stops opening PRs.
#
# That step's script has a bats suite at
# `tests/workflows/check-preset-refs.bats`, which extracts it from this file
# and runs it against a stub API.
name: Validate Renovate configuration

on:
  pull_request:
    paths:
      # Catch nested renovate configs too if/when subprojects appear.
      - "**renovate.json5"
      # Shared preset files consumed by tbhb repositories through extends.
      # Neither ends in `renovate.json5`, so each needs its own pattern —
      # and `**renovate-config.json5` does not match the Go preset either,
      # since `renovate-go-config.json5` differs before the `-config` part.
      - "**renovate-config.json5"
      - "**renovate-go-config.json5"
      # Self-test: a change to this workflow re-runs it, so no step lands
      # here without having run against a real config first.
      - ".github/workflows/renovate-config-validator.yaml"
  workflow_call:
    inputs:
      config_path:
        type: string
        description: "Path to the Renovate config to validate, relative to the repo root"
        default: ".github/renovate.json5"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration
        env:
          CONFIG_PATH: ${{ inputs.config_path || '.github/renovate.json5' }}
        run: |
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          RENOVATE_IMAGE="ghcr.io/renovatebot/renovate:44.138.0@sha256:32027ed5e5e450f76ee372fcd6e72c8114db7fdb28c97c520515a03ea4a0d77b"
          # Same image as the `renovate-image` input in renovate.yaml;
          # Renovate bumps both in one PR. Hand the pin to the
          # preset-reference step so both steps run the same engine.
          echo "RENOVATE_IMAGE=${RENOVATE_IMAGE}" >> "${GITHUB_ENV}"
          # Validate the repo config plus whichever shared preset files are
          # present. The presets live only in this repo; workflow_call
          # callers pass their own config_path and carry no presets, so the
          # loop adds nothing there and the original single-file behavior is
          # kept.
          configs=("${CONFIG_PATH}")
          for preset in .github/renovate-config.json5 .github/renovate-go-config.json5; do
            [ -f "${preset}" ] && configs+=("${preset}")
          done
          docker run --rm --entrypoint renovate-config-validator \
            -v "${{ github.workspace }}:/repo" -w /repo \
            "${RENOVATE_IMAGE}" "${configs[@]}"

      - name: Verify preset references resolve
        env:
          CONFIG_PATH: ${{ inputs.config_path || '.github/renovate.json5' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # renovate-config-validator does not resolve remote presets. A config
          # whose `extends` names a preset that does not exist still validates
          # successfully, so a typo, a rename, or a consumer merging ahead of the
          # preset it references all pass this gate. Renovate then fails at
          # runtime with config-presets-invalid and silently stops opening PRs on
          # the repo until someone notices. This step closes that gap.
          #
          # The script is inlined rather than committed as a file because
          # workflow_call runs against the *caller's* checkout, where a script
          # living in this repo would not exist.
          cat > "${RUNNER_TEMP}/check-preset-refs.mjs" <<'MJS'
          import { existsSync, readFileSync } from "node:fs";
          import { createRequire } from "node:module";

          // json5 ships inside the Renovate image but is not resolvable from the
          // default module paths, so reach it through the image's node_modules.
          const JSON5 = createRequire("/usr/local/renovate/").call(null, "json5");

          const selfRepo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          // Actions sets GITHUB_API_URL on every runner, so reading it costs
          // nothing here and gives the bats suite somewhere to point a stub
          // API. The tests need that seam: this script never runs against
          // github.com under test.
          const api = process.env.GITHUB_API_URL ?? "https://api.github.com";

          const refs = new Set();
          for (const file of process.argv.slice(2)) {
            const config = JSON5.parse(readFileSync(file, "utf8"));
            for (const key of ["extends", "globalExtends"]) {
              for (const entry of config[key] ?? []) {
                if (typeof entry === "string" && entry.startsWith("github>")) {
                  refs.add(entry);
                }
              }
            }
          }

          let failed = 0;
          for (const ref of [...refs].sort()) {
            // Two forms appear in these repos: `github>owner/repo//path` and
            // the same with a `#ref` suffix pinning it to a tag or a commit.
            // Anything else fails rather than being skipped: a silently ignored
            // reference is the exact failure this check exists to prevent.
            const match =
              /^github>([^/#:]+)\/([^/#:]+)\/\/([^#:]+)(?:#([^#:]+))?$/.exec(ref);
            if (!match) {
              console.log(`FAIL  ${ref} (unrecognized reference shape)`);
              failed += 1;
              continue;
            }
            const [, owner, repo, path, pinned] = match;
            const slug = `${owner}/${repo}`;
            const at = pinned ? `ref ${pinned}` : "default branch";

            if (slug === selfRepo && !pinned) {
              // Unpinned self-reference: check this PR's tree rather than the
              // default branch, so a preset added or renamed in this same PR
              // resolves against what will actually land. A *pinned* self-
              // reference names one commit instead, which the PR tree cannot
              // answer for, so it falls through to the fetch like any other —
              // checking the tree there would pass on the strength of a file
              // the named ref may not carry.
              if (existsSync(path)) {
                console.log(`ok    ${slug}//${path} (this repo, PR tree)`);
              } else {
                console.log(`FAIL  ${slug}//${path} (not in this PR's tree)`);
                failed += 1;
              }
              continue;
            }

            // `?ref=` is what makes a pinned reference mean anything. Without
            // it the API answers for the default branch, so a reference pinned
            // to a commit where the preset is absent would be reported as
            // resolving on the strength of a file that exists on main today.
            const url = new URL(`${api}/repos/${slug}/contents/${path}`);
            if (pinned) url.searchParams.set("ref", pinned);
            const response = await fetch(url, {
              headers: {
                accept: "application/vnd.github+json",
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
            });
            if (response.ok) {
              console.log(`ok    ${slug}//${path} (${at})`);
            } else {
              console.log(`FAIL  ${slug}//${path} (${at}, HTTP ${response.status})`);
              failed += 1;
            }
          }

          if (refs.size === 0) console.log("no github> preset references to check");
          if (failed > 0) {
            console.log(`\n${failed} preset reference(s) did not resolve.`);
            process.exit(1);
          }
          MJS
          configs=("${CONFIG_PATH}")
          for preset in .github/renovate-config.json5 .github/renovate-go-config.json5; do
            [ -f "${preset}" ] && configs+=("${preset}")
          done
          docker run --rm --entrypoint node \
            -e GITHUB_REPOSITORY -e GH_TOKEN -e GITHUB_API_URL \
            -v "${{ github.workspace }}:/repo" \
            -v "${RUNNER_TEMP}/check-preset-refs.mjs:/check-preset-refs.mjs:ro" \
            -w /repo "${RENOVATE_IMAGE}" \
            /check-preset-refs.mjs "${configs[@]}"
