# The pull request draft inherits the Markdown rule set and drops the
# heading capitalization rule alone. Its level 1 heading holds the title,
# which has to take the Conventional Commits shape because a squash merge
# turns it into a commit subject, and the type opening that shape is
# lowercase by definition. Sentence case and that shape can never both
# hold, so every draft this workflow writes would fail the rule.
[PR_AGENTDESC.md]
project.HeadingTitleCase = NO

[*.go]
BasedOnStyles = Vale, Google, project, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = error
# Every Go file opens with the "// SPDX-License-Identifier: Apache-2.0"
# header, and ColonUsage flags the proper noun after that colon. The
# rule's own guidance is to disable it where a colon convention is
# established, so it stays off for Go source.
ai-tells.ColonUsage = NO
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
# Off for Go source. The analyzer reads the whole file as prose, so
# `return` and `if` statements register as repeated sentence openers and
# the finding scales with file length rather than with anything about the
# writing. Comment prose is still covered by the rest of the set.
ai-tells-experimental.SentenceStartRepetition = NO
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
project.Acronyms = error
# Superseded by ai-tells.ColonUsage (see the *.md section), which is
# itself off for Go source per the SPDX note above.
project.Colons = NO
project.HeadingTitleCase = error
project.WordList = error
# Google.Acronyms is disabled: project.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to project exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
# Google.Passive and write-good.Passive disabled: the tagger-based
# ai-tells-experimental passive rules flag every grammatical passive
# without the predicate-adjective false positives of the regex shape,
# so the regex rules and write-good.E-Prime retire.
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
# Google.Spacing flags "errors.Is" and "errors.Join" as missing a space
# after the period. False positive on dotted Go identifiers; keep off for
# Go source.
Google.Spacing = NO
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordList = NO
# Same case-insensitive word-substitution shape as WordList above, so
# the same false-positive risk: "Touch ID" is Apple's proper-noun name
# for the biometric feature, and the rule's stock swap rewrites it to
# the nonexistent "tap ID."
Google.WordListCase = NO
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

[vendor/**/*.go]
BasedOnStyles =

# Test files inherit the rule set from [*.go] but silence the
# ai-tells-experimental rules that misfire on table-driven test
# code:
#
#   ContentDuplication — table cases legitimately reuse struct
#                        literals and identifier names across rows.
#   SentenceStartRepetition — every doc comment on a helper function
#                             starts with "//", which the analyzer
#                             treats as a repeated sentence opener.
#   ParagraphLengthVariance — the "paragraphs" it measures in a test
#                             file are blank-line-separated blocks of
#                             Go, and t.Run subtests are uniform by
#                             construction. Prose pacing is not a
#                             property test code has.
#   PassiveDensity — the ratio it reports is drawn from Go source, not
#                    from writing. Sentences split on a period followed
#                    by a space, which test code hardly ever contains,
#                    so a whole file collapses into a handful of them;
#                    the passives it counts against that denominator
#                    are t.Run names like "wrapped write is denied",
#                    where the passive is the idiomatic way to name the
#                    behavior under test. A file clears the rule's
#                    six-sentence floor as soon as anyone writes a
#                    comment, which is the wrong thing to discourage.
[**/*_test.go]
ai-tells-experimental.ContentDuplication = NO
ai-tells-experimental.SentenceStartRepetition = NO
ai-tells-experimental.ParagraphLengthVariance = NO
ai-tells-experimental.PassiveDensity = NO

[{CHANGELOG.md,.vale/**/*.md,tmp/**/*.md,vendor/**/*.md,vendor/**/*.go}]
BasedOnStyles =
