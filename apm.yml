---
# APM workspace and consumer manifest for this repo. The primitives
# themselves live in the four sub-packages under packages/agents/,
# which this file depends on by local path so `apm install` here
# dogfoods them into this repo's own harness layout. All three
# harnesses are active, so a harness-neutral primitive deploys into
# every one of them and a targeted package reaches only its own.
# Consumers pin a sub-package by tag instead, as
# tbhb-dev/devtools/packages/agents/claude#vX.Y.Z. The cog pre-bump hook
# keeps `version` in lockstep with the vX.Y.Z git tags (see cog.toml).
name: devtools
version: 0.9.0
description: Shared agent packages for tbhb repositories
author: tbhb
license: Apache-2.0
targets:
  - claude
  - codex
  - antigravity
dependencies:
  apm:
    - ./packages/agents/common
    - ./packages/agents/claude
    - ./packages/agents/codex
    - ./packages/agents/agy
  mcp: []
scripts: {}
