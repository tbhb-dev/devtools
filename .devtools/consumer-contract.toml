# The consumer contract for this release: the settings the release's readers
# accept in a consumer's .agents/agent-skills.conf, and the transitions a
# consumer must make to adopt the release. Rendered into
# docs/consumer-transitions.md by `agentrepo contract render`.
#
# A key is required when the readers reject the conf without it, and accepts
# lists the value classes the readers take once it is present. Every release
# declares its transitions explicitly: `none = true`, or one entry for each
# required change. `baseline = true` marks the release that introduced this
# contract. Its keys must equal what the preceding tag's reader does.
schema_version = 1
baseline = true

[[key]]
file = ".agents/agent-skills.conf"
name = "lint_commit_cmd"
required = false
accepts = ["empty", "nonempty"]
sample = "probe-sample"

