# Commands a shell script in this repository may run. The shell-allowlist
# command reports every other command it finds, and it always reports the
# banned interpreters and data tools, whatever this file says.

# Shell builtins. `eval` is a builtin too, but it is banned outright.
builtins = [
  ".",
  ":",
  "[",
  "alias",
  "bg",
  "bind",
  "break",
  "builtin",
  "caller",
  "cd",
  "command",
  "compgen",
  "complete",
  "compopt",
  "continue",
  "declare",
  "dirs",
  "disown",
  "echo",
  "enable",
  "exec",
  "exit",
  "export",
  "false",
  "fc",
  "fg",
  "getopts",
  "hash",
  "help",
  "history",
  "jobs",
  "kill",
  "let",
  "local",
  "logout",
  "mapfile",
  "popd",
  "pushd",
  "pwd",
  "read",
  "readarray",
  "readonly",
  "return",
  "set",
  "shift",
  "shopt",
  "source",
  "suspend",
  "times",
  "trap",
  "true",
  "type",
  "typeset",
  "ulimit",
  "umask",
  "unalias",
  "unset",
  "wait",
]

# Tools every host this repository runs on provides.
tools = ["git", "gh", "ssh", "scp", "mise"]

# The coreutils a script may call.
coreutils = [
  "cat",
  "cp",
  "mv",
  "rm",
  "mkdir",
  "chmod",
  "chown",
  "ln",
  "install",
  "test",
  "printf",
  "date",
  "env",
  "uname",
  "hostname",
  "id",
  "sleep",
]

# This repository's own Go binaries, one per directory under cmd/.
binaries = [
  "agentcontext",
  "agenthooks",
  "agentrepo",
  "agentstore",
  "agy-otel",
  "commit-lint",
  "gh-post",
  "gh-reviewer",
  "guard-markdown",
  "shell-allowlist",
  "ssh-sign",
  "test-hooks",
]
