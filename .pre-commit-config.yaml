---
default_stages: [pre-commit, pre-push]

# Hooks never touch vendored third-party code; that source is reviewed
# at PR time as part of vendor-tidy, not reformatted to match this
# project's style. Same applies to Vale's synced style packages and
# build output.
# tools/mise-bootstrap is excluded as generated output: `mise generate
# bootstrap` writes it without a final newline, and a fixer hook adding
# one would put the committed file one byte off from what regeneration
# produces, flip-flopping on every bump.
exclude: ^(vendor/|\.vale/(Google|write-good|proselint|ai-tells.*)/|bin/|dist/|tools/mise-bootstrap$)

# Every hook that runs a project tool resolves it through the committed
# mise bootstrap shim, so the hook runs the pinned binary from mise.toml
# rather than whatever is on the operator's PATH -- and it does so even
# on a machine with no mise installed. The external vale, yamllint, and
# rumdl hook repos are gone for the same reason: prek built its own
# environments from its own pins, which is how vale ran 3.15.2 behind
# the hook and 3.17.0 behind the recipes, so a prose finding could
# appear in one gate and not the other.
repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Shared commit-msg gates. This repository publishes them (see
  # .pre-commit-hooks.yaml) and applies them to itself, the same way it
  # treats guard-markdown below: the hooks run from the working tree
  # rather than from a released tag, so an edit to one of these scripts
  # gates the very commit that makes it instead of waiting for a release.
  # That is why the ids resolve locally and no `rev:` appears here.
  #
  # The first four run on the commit-msg stage; commitlint and
  # commit-trailers need only bash/git, while vale-commit-msg and
  # cspell-commit-msg lean on this repo's vale/cspell plus the
  # commit-message scope in .vale.ini and .cspell.jsonc.
  - repo: local
    hooks:
      - id: commit-trailers
        name: commit-trailers
        entry: scripts/commit-trailers.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: commitlint
        name: commitlint
        entry: scripts/commitlint.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: vale-commit-msg
        name: vale (commit message)
        entry: scripts/vale-commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: cspell-commit-msg
        name: cspell (commit message)
        entry: scripts/cspell-commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true

      # The one post-commit hook. It deletes the COMMIT_AGENTMSG draft
      # once a commit succeeds, so the next commit starts from an absent
      # path rather than a stale draft. Needs the stage installed, which
      # `mise run prek-install` covers.
      - id: clear-commit-agentmsg
        name: clear COMMIT_AGENTMSG
        entry: scripts/clear-commit-agentmsg.sh
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      # Scoped to the file types .vale.ini actually configures rules for
      # (Markdown + Go source). The lint-prose task's glob keeps the
      # generated CHANGELOG.md and the vendored trees out of the walk,
      # but prek passes filenames here, so the exclude has to repeat at
      # the hook level too.
      - id: vale
        name: vale
        entry: tools/mise-bootstrap run lint-prose
        language: system
        types_or: [markdown, go]
        exclude: ^CHANGELOG\.md$

      - id: ryl
        name: Check YAML files with ryl
        entry: tools/mise-bootstrap run devtools:lint-yaml
        language: system
        types: [yaml]

      - id: rumdl-fmt
        name: rumdl fmt
        entry: tools/mise-bootstrap run devtools:format-markdown
        language: system
        types: [markdown]

      - id: rumdl
        name: rumdl check
        entry: tools/mise-bootstrap run devtools:lint-markdown
        language: system
        types: [markdown]

      # biome's write mode has no task counterpart, so the hook execs the
      # pinned binary directly.
      - id: biome-check
        name: biome check
        entry: tools/mise-bootstrap exec -- biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      # The Go formatter and linter run golangci-lint from its mise pin
      # through the shim. golangci-lint owns the file list (its own
      # discovery minus vendor/, in vendor mode), so the hooks pass no
      # filenames and only decide *whether* to run.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: tools/mise-bootstrap run format-go
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: tools/mise-bootstrap run lint-go
        language: system
        types: [go]
        pass_filenames: false

      # Shell gates. The formatter runs first and rewrites in place (a
      # modified file fails the commit, so the contributor reviews and
      # re-stages); then the correctness linter runs the mise-pinned
      # shellcheck through its task. The `lint-shell-fmt` diff gate has
      # no hook of its own — shfmt has already normalized the file by
      # the time shellcheck runs — and CI still reads it through the
      # lint aggregate.
      - id: shfmt
        name: shfmt
        entry: tools/mise-bootstrap run format-shell
        language: system
        types: [shell]
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: tools/mise-bootstrap run lint-shell
        language: system
        types: [shell]
        pass_filenames: false

      # Format-check the mise config files with mise's own formatter.
      # mise fmt reads and writes a whole file, so this hook checks
      # rather than fixes; run `mise fmt` to apply.
      - id: mise-fmt
        name: mise fmt --check
        entry: tools/mise-bootstrap run devtools:lint-mise
        language: system
        files: ^(mise\.toml|\.config/mise/conf\.d/.*\.toml)$
        pass_filenames: false

      # Gate the committed lockfiles against the pins whenever either
      # side changes, so a bumped pin cannot reach a commit without its
      # lockfile entry.
      - id: check-toolchain
        name: mise check-toolchain
        entry: tools/mise-bootstrap run devtools:check-toolchain
        language: system
        files: ^(mise\.(toml|lock)|\.config/mise/(conf\.d/.*\.toml|mise\.lock))$
        pass_filenames: false

      # Whole-tree run on every commit. The task feeds the checker the git
      # index itself and finishes in well under a second, and its scope
      # lives in .editorconfig-checker.json, so passing filenames here would
      # only give the hook a second, drifting copy of that scope.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: tools/mise-bootstrap run lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false

      - id: vendor-tidy
        name: go mod tidy + vendor drift check
        entry: tools/mise-bootstrap run vendor-check
        language: system
        files: ^(go\.mod|go\.sum|vendor/)
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off
      # the commit-msg stage so the cspell-commit-msg hook above owns
      # the commit buffer with worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: tools/mise-bootstrap run devtools:lint-spelling
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: tools/mise-bootstrap run devtools:lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # Python gates, wired like the Go and shell pairs above: the task
      # owns the scope (pyproject.toml), so the hooks pass no filenames
      # and only decide *whether* to run. The formatter runs first and
      # rewrites in place, then the correctness linters.
      - id: ruff-format
        name: ruff format
        entry: tools/mise-bootstrap run format-py
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: tools/mise-bootstrap run lint-ruff
        language: system
        types: [python]
        pass_filenames: false

      - id: pyrefly
        name: pyrefly
        entry: tools/mise-bootstrap run lint-types
        language: system
        types: [python]
        pass_filenames: false

      # APM's hook merge is additive and never reconciles a declaration that
      # was removed or that sorts ahead of an existing one, so .claude/ can
      # disagree with the packaged sources while every file involved looks
      # reasonable. The apm-package workflow already catches it, but only
      # after a push, and `apm install` is not the fix — `mise run apm-sync`
      # is. This hook moves that finding to the commit.
      #
      # Scoped to the inputs that can change the deployed set: the root
      # manifest, each agent package's manifest and .apm/ tree, and the two
      # .claude/ files the merge writes. apm.lock.yaml is deliberately
      # absent: it never records hook declarations, so it stays
      # byte-identical across a hook add or delete.
      - id: apm-audit
        name: apm audit
        entry: tools/mise-bootstrap run lint-apm
        language: system
        files: ^(packages/agents/[^/]+/(\.apm/|apm\.yml$)|apm\.yml$|\.claude/(settings|apm-hooks)\.json$)
        pass_filenames: false

      # uv.lock drift, the Python counterpart to the vendor-tidy hook
      # above. Scoped to the files that can cause the drift.
      - id: lock-check
        name: uv lock --check
        entry: tools/mise-bootstrap run lock-check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # This repository publishes the check (see .pre-commit-hooks.yaml)
      # and applies it to itself. It runs the task, which builds from the
      # working tree, rather than the published manifest: a change to the
      # detector then gates the very commit that makes it, instead of being
      # checked against the last released binary.
      - id: guard-markdown
        name: guard-markdown
        entry: tools/mise-bootstrap run lint-markdown-wrap
        language: system
        types: [markdown]
        pass_filenames: false
