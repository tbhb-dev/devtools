tag_prefix = "v"

# Keep every published version literal in lockstep with the tag cog is
# about to cut. The hooks run before the version commit, so each
# rewrite lands inside that commit and one vX.Y.Z tag serves every
# consumer path (apm install #vX.Y.Z, go install @vX.Y.Z, a
# .pre-commit-config.yaml rev, the Python package's own version). perl
# rather than sed keeps the in-place edit portable across the BSD sed
# on macOS dev hosts and GNU sed on CI runners.
#
# Only apm.yml was maintained here to begin with. The other five each
# took a hand edit, no gate read them, and #25 realigned them by hand.
# The braces on the README and hook-manifest patterns are perl's
# delimiter choice rather than anything regex-specific: those patterns
# carry a literal slash, and `s{}{}` spells that without escaping it.
#
# uv.lock is the one site a version bump breaks rather than merely
# leaving stale. It records the version of the editable devtools
# package, `uv lock --check` gates the two against each other, and the
# release job carries no uv to regenerate it, so the rewrite has to be
# textual like the rest. It needs two lines of context because every
# package in the lockfile has a `version =` line, which is what -0777
# and the /m anchor are for.
#
# tools/check-versions.sh asserts the result. Adding another site
# means a line there and a hook here, in that order.
#
# The README hook matches both the bare repo ref
# (tbhb-dev/devtools#vX.Y.Z) and a sub-package ref
# (tbhb-dev/devtools/packages/agents/claude#vX.Y.Z), keeping the matched
# prefix in $1 so the optional sub-path survives the rewrite untouched.
# The g flag covers a line naming more than one ref.
pre_bump_hooks = [
  "perl -pi -e 's/^version: .*/version: {{version}}/' apm.yml",
  "perl -pi -e 's/^version: .*/version: {{version}}/' packages/agents/common/apm.yml",
  "perl -pi -e 's/^version: .*/version: {{version}}/' packages/agents/claude/apm.yml",
  "perl -pi -e 's/^version: .*/version: {{version}}/' packages/agents/codex/apm.yml",
  "perl -pi -e 's/^version: .*/version: {{version}}/' packages/agents/agy/apm.yml",
  "perl -pi -e 's/^version = .*/version = \"{{version}}\"/' packages/devtools/pyproject.toml",
  "perl -pi -e 's{rev: v[0-9.]+}{rev: v{{version}}}' .pre-commit-hooks.yaml",
  "perl -pi -e 's{(tbhb-dev/devtools(?:/[a-z/-]+)?#v)[0-9.]+}{${1}{{version}}}g' README.md",
  "perl -pi -e 's{rev: v[0-9.]+}{rev: v{{version}}}' README.md",
  "perl -0777 -pi -e 's/^name = \"devtools\"\nversion = .*/name = \"devtools\"\nversion = \"{{version}}\"/m' uv.lock",
]

[changelog]
path = "CHANGELOG.md"
template = ".cog/changelog.tera"
remote = "github.com"
repository = "devtools"
owner = "tbhb-dev"
authors = [{ username = "tbhb", signature = "Tony Burns" }]

[commit_types]
chore = { omit_from_changelog = true }
test = { omit_from_changelog = true }
