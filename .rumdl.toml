[global]
disable = [
  "MD013",  # Line length — we don't hardwrap markdown.
  "MD033",  # Inline HTML — needed for cosign/badge embeds.
]
respect_gitignore = true
exclude = [
  ".git",
  ".vale",
  "tmp",
  "vendor",
  ".claude/skills/*/SKILL.md",
  "CODEOWNERS",
  "LICENSE",
]

# Per-path rule exclusions for the cog-generated CHANGELOG.md, which
# repeats version headings (MD024) and opens with a horizontal rule
# immediately followed by the `<!-- release -->` insertion marker cog
# writes with no blank line between them (MD065). MD013 is already
# disabled globally, and MD041 stays enforced here (the file opens with
# `# Changelog`); the heading-less release-note fragments disable MD041
# in their own recipe.
#
# The pull request template opens at level 2 instead, so MD041 comes off
# for that path: GitHub renders the pull request title above the body,
# and a level 1 heading inside the template would repeat it.
#
# A skill source's parts/ fragments are spliced into a SKILL.md by
# tools/generate-skills.sh, usually opening with the level 2 heading of
# the step they hold, so they never start a document. The generated
# SKILL.md they land in is linted whole.
[per-file-ignores]
"CHANGELOG.md" = ["MD024", "MD065"]
".github/pull_request_template.md" = ["MD041"]
"packages/agents/source/skills/*/parts/*.md" = ["MD041"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD048]
style = "backtick"
