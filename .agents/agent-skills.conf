# cspell:words noqa nosec
owner_review_label = merge:owner-review
# Protect merge enforcement, its policy, shared libraries, and skill guards.
golden_paths = ^(\.agents/(agent-skills\.conf|review-instructions\.md)$|\.github/rulesets/|\.claude/settings\.json$|packages/agents/source/(lib/(lib|agent)\.sh$|skills/[^/]+/(shared|claude|codex)/scripts/guard[^/]*\.sh$|skills/merge-pr/(shared|claude|codex)/scripts/(merge-agent\.sh|merge-policy\.py)$)|(packages/agents/(claude|codex)/\.apm/skills|\.(claude|agents)/skills)/([^/]+/scripts/(guard[^/]*\.sh|(lib|agent)\.sh)$|(merge-pr|agent-merge-pr)/scripts/(merge-agent\.sh|merge-policy\.py)$))
constitutional_paths = ^(\.agents/(agent-skills\.conf|review-instructions\.md)$|\.github/(rulesets/|CODEOWNERS$)|\.claude/settings\.json$|packages/agents/source/(lib|skills/merge-pr/(shared|claude|codex)/scripts)/(merge-policy\.py|merge-agent\.sh|signing\.sh|lib\.sh)$|(packages/agents/[^/]+/\.apm/skills|\.(claude|agents)/skills)/[^/]+/scripts/(merge-policy\.py|merge-agent\.sh|signing\.sh|lib\.sh)$)
loosening_markers = noqa|nosec|nolint|shellcheck disable|vale (off|disable)|cspell:disable|rumdl-disable|type: ignore|pragma: no cover
# Include task bodies as well as the files that configure their checkers.
gate_config_paths = ^(mise\.toml$|\.config/mise/|\.devtools/(tasks|config)/|\.github/|\.(pre-commit-config\.yaml|pre-commit-hooks\.yaml|gitleaks\.toml|vale\.ini|cspell\.jsonc|rumdl\.toml|golangci\.yml|go-arch-lint\.yml|testcoverage\.yml|yamllint\.yaml|yamllintignore|editorconfig-checker\.json|commit-lint\.toml|gremlins\.yaml)$|\.vale/|\.ast-grep/|pyproject\.toml$|packages/devtools/pyproject\.toml$|cosmic-ray\.toml$|biome\.json$|tombi\.toml$|sgconfig\.yml$|\.leak-(allow|skip)$)
owner_paths = ^(\.agents/(agent-skills\.conf|review-instructions\.md)$|\.github/rulesets/|\.claude/settings\.json$|packages/agents/source/(lib/(lib|agent)\.sh$|skills/[^/]+/(shared|claude|codex)/scripts/guard[^/]*\.sh$|skills/merge-pr/(shared|claude|codex)/scripts/(merge-agent\.sh|merge-policy\.py)$)|(packages/agents/(claude|codex)/\.apm/skills|\.(claude|agents)/skills)/([^/]+/scripts/(guard[^/]*\.sh|(lib|agent)\.sh)$|(merge-pr|agent-merge-pr)/scripts/(merge-agent\.sh|merge-policy\.py)$))
# Keep settings, notes, dependency directories, and other worktrees.
disposable_ignored = ^(bin/|dist/|coverage\.(out|html|txt|xml)$|coverage\.covdata[^/]*/|\.coverage(\.[^/]*)?$|htmlcov/|\.pytest_cache/|\.hypothesis/|\.ruff_cache/|\.complexipy_cache/|\.rumdl_cache/|\.cspell-cache$|([^/]+/)*__pycache__/)
