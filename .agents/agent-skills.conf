# cspell:words noqa nosec
# Protect the published payload and the programs that enforce agent gates.
golden_paths = ^(\.devtools/|\.config/mise/conf\.d/|\.github/(workflows|rulesets)/|\.pre-commit-hooks\.yaml$|scripts/|packages/agents/source/(lib/|skills/[^/]+/((shared|claude)/scripts/|SKILL\.claude\.md$))|packages/agents/(claude|codex)/\.apm/skills/[^/]+/(SKILL\.md$|scripts/guard[^/]*\.sh$)|\.(claude|agents)/skills/[^/]+/scripts/guard[^/]*\.sh$|\.claude/settings\.json$)
loosening_markers = noqa|nosec|nolint|shellcheck disable|vale (off|disable)|cspell:disable|rumdl-disable|type: ignore|pragma: no cover
# Include task bodies as well as the files that configure their checkers.
gate_config_paths = ^(mise\.toml$|\.config/mise/|\.devtools/(tasks|config)/|\.github/|\.(pre-commit-config\.yaml|pre-commit-hooks\.yaml|gitleaks\.toml|vale\.ini|cspell\.jsonc|rumdl\.toml|golangci\.yml|go-arch-lint\.yml|testcoverage\.yml|yamllint\.yaml|yamllintignore|editorconfig-checker\.json|commit-lint\.toml|gremlins\.yaml)$|\.vale/|\.ast-grep/|pyproject\.toml$|packages/devtools/pyproject\.toml$|cosmic-ray\.toml$|biome\.json$|tombi\.toml$|sgconfig\.yml$|\.leak-(allow|skip)$)
owner_paths = ^(\.agents/(agent-skills\.conf|review-instructions\.md)$|\.devtools/|\.config/mise/|\.github/|\.claude/settings\.json$|\.(claude|agents)/skills/|packages/agents/|scripts/|tools/|mise\.toml$|\.(pre-commit-config\.yaml|pre-commit-hooks\.yaml|gitleaks\.toml|vale\.ini|cspell\.jsonc|rumdl\.toml|golangci\.yml|go-arch-lint\.yml|testcoverage\.yml|yamllint\.yaml|yamllintignore|editorconfig-checker\.json|commit-lint\.toml|gremlins\.yaml)$|\.vale/|\.ast-grep/|pyproject\.toml$|packages/devtools/pyproject\.toml$|cosmic-ray\.toml$|biome\.json$|tombi\.toml$|sgconfig\.yml$|\.leak-(allow|skip)$)
# Keep settings, notes, dependency directories, and other worktrees.
disposable_ignored = ^(bin/|dist/|coverage\.(out|html|txt|xml)$|coverage\.covdata[^/]*/|\.coverage(\.[^/]*)?$|htmlcov/|\.pytest_cache/|\.hypothesis/|\.ruff_cache/|\.complexipy_cache/|\.rumdl_cache/|\.cspell-cache$|([^/]+/)*__pycache__/)
